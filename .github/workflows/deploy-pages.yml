name: Deploy Aawz prototype to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "prototype/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Add Arabic search normalization
        run: sed -i 's#</body>#<script src="./search-normalization.js"></script></body>#' prototype/index.html

      - name: Add accessibility enhancements
        run: sed -i 's#</body>#<script src="./accessibility.js"></script></body>#' prototype/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./prototype

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
