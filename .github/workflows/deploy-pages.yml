name: Test and deploy Aawz prototype

on:
  push:
    branches: ["main"]
    paths:
      - "prototype/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "prototype/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Arabic search normalization
        run: node tests/search-normalization.test.cjs

      - name: Test order review enhancement
        run: |
          node --check prototype/order-review.js
          node tests/order-review.test.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Add Arabic search normalization
        run: sed -i 's#</body>#<script src="./search-normalization.js"></script></body>#' prototype/index.html

      - name: Add accessibility enhancements
        run: sed -i 's#</body>#<script src="./accessibility.js"></script></body>#' prototype/index.html

      - name: Add order review enhancement
        run: sed -i 's#</body>#<script src="./order-review.js"></script></body>#' prototype/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./prototype

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
