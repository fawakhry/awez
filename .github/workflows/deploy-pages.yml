name: Test and deploy Aawz prototype

on:
  push:
    branches: ["main"]
    paths:
      - "prototype/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "prototype/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Arabic search normalization
        run: node tests/search-normalization.test.cjs

      - name: Test order review enhancement
        run: |
          node --check prototype/order-review.js
          node tests/order-review.test.js

      - name: Test duplicate order guard
        run: |
          node --check prototype/duplicate-order-guard.js
          node tests/duplicate-order-guard.test.cjs

      - name: Test merchant session enhancement
        run: |
          node --check prototype/merchant-session.js
          node tests/merchant-session.test.cjs

      - name: Test lazy panorama loading
        run: |
          node --check prototype/lazy-panorama.js
          node tests/lazy-panorama.test.cjs

      - name: Test checkout validation
        run: |
          node --check prototype/checkout-validation.js
          node tests/checkout-validation.test.cjs

      - name: Test orders CSV export
        run: |
          node --check prototype/orders-csv-export.js
          node tests/orders-csv-export.test.cjs

      - name: Test keyboard search
        run: |
          node --check prototype/search-keyboard.js
          node tests/search-keyboard.test.cjs

      - name: Test view focus management
        run: |
          node --check prototype/view-focus.js
          node tests/view-focus.test.cjs

      - name: Test reduced motion support
        run: node tests/reduced-motion.test.cjs

      - name: Test merchant order filtering
        run: |
          node --check prototype/merchant-order-filter.js
          node tests/merchant-order-filter.test.cjs

      - name: Test cross-tab synchronization
        run: |
          node --check prototype/cross-tab-sync.js
          node tests/cross-tab-sync.test.cjs

      - name: Test network status enhancement
        run: |
          node --check prototype/network-status.js
          node tests/network-status.test.cjs

      - name: Test checkout draft persistence
        run: |
          node --check prototype/checkout-draft.js
          node tests/checkout-draft.test.cjs

      - name: Test checkout autofill enhancement
        run: |
          node --check prototype/checkout-autofill.js
          node tests/checkout-autofill.test.cjs

      - name: Test web app manifest
        run: node tests/web-app-manifest.test.cjs

      - name: Test offline app shell
        run: |
          node --check prototype/service-worker.js
          node --check prototype/register-service-worker.js
          node tests/offline-shell.test.cjs

      - name: Test service worker update notice
        run: |
          node --check prototype/service-worker-update.js
          node tests/service-worker-update.test.cjs

      - name: Test product delete undo
        run: |
          node --check prototype/product-delete-undo.js
          node tests/product-delete-undo.test.cjs

      - name: Test low stock alert
        run: |
          node --check prototype/low-stock-alert.js
          node tests/low-stock-alert.test.cjs

      - name: Test skip link
        run: |
          node --check prototype/skip-link.js
          node tests/skip-link.test.cjs

      - name: Test active navigation state
        run: |
          node --check prototype/active-navigation.js
          node tests/active-navigation.test.cjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Add web app manifest
        run: sed -i 's#</head>#<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.svg" type="image/svg+xml"></head>#' prototype/index.html

      - name: Add reduced motion stylesheet
        run: sed -i 's#</head>#<link rel="stylesheet" href="./reduced-motion.css"></head>#' prototype/index.html

      - name: Remove blocking Pannellum assets
        run: |
          sed -i '/pannellum@2.5.6\/build\/pannellum.css/d' prototype/index.html
          sed -i '/pannellum@2.5.6\/build\/pannellum.js/d' prototype/index.html

      - name: Add Arabic search normalization
        run: sed -i 's#</body>#<script src="./search-normalization.js"></script></body>#' prototype/index.html

      - name: Add accessibility enhancements
        run: sed -i 's#</body>#<script src="./accessibility.js"></script></body>#' prototype/index.html

      - name: Add order review enhancement
        run: sed -i 's#</body>#<script src="./order-review.js"></script></body>#' prototype/index.html

      - name: Add duplicate order guard
        run: sed -i 's#</body>#<script src="./duplicate-order-guard.js"></script></body>#' prototype/index.html

      - name: Add merchant session enhancement
        run: sed -i 's#</body>#<script src="./merchant-session.js"></script></body>#' prototype/index.html

      - name: Add lazy panorama loading
        run: sed -i 's#</body>#<script src="./lazy-panorama.js"></script></body>#' prototype/index.html

      - name: Add checkout validation
        run: sed -i 's#</body>#<script src="./checkout-validation.js"></script></body>#' prototype/index.html

      - name: Add orders CSV export
        run: sed -i 's#</body>#<script src="./orders-csv-export.js"></script></body>#' prototype/index.html

      - name: Add keyboard search
        run: sed -i 's#</body>#<script src="./search-keyboard.js"></script></body>#' prototype/index.html

      - name: Add view focus management
        run: sed -i 's#</body>#<script src="./view-focus.js"></script></body>#' prototype/index.html

      - name: Add merchant order filtering
        run: sed -i 's#</body>#<script src="./merchant-order-filter.js"></script></body>#' prototype/index.html

      - name: Add cross-tab synchronization
        run: sed -i 's#</body>#<script src="./cross-tab-sync.js"></script></body>#' prototype/index.html

      - name: Add network status enhancement
        run: sed -i 's#</body>#<script src="./network-status.js"></script></body>#' prototype/index.html

      - name: Add checkout draft persistence
        run: sed -i 's#</body>#<script src="./checkout-draft.js"></script></body>#' prototype/index.html

      - name: Add checkout autofill enhancement
        run: sed -i 's#</body>#<script src="./checkout-autofill.js"></script></body>#' prototype/index.html

      - name: Add service worker update notice
        run: sed -i 's#</body>#<script src="./service-worker-update.js"></script></body>#' prototype/index.html

      - name: Add low stock alert
        run: sed -i 's#</body>#<script src="./low-stock-alert.js"></script></body>#' prototype/index.html

      - name: Add skip link
        run: sed -i 's#</body>#<script src="./skip-link.js"></script></body>#' prototype/index.html

      - name: Add active navigation state
        run: sed -i 's#</body>#<script src="./active-navigation.js"></script></body>#' prototype/index.html

      - name: Register offline app shell
        run: sed -i 's#</body>#<script src="./register-service-worker.js"></script></body>#' prototype/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./prototype

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
